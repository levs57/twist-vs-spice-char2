[workspace]
resolver = "3"
members = [
    "crates/om-field",
    "crates/om-transcript",
    "crates/om-sumcheck",
    "crates/om-pcs",
    "crates/om-mosaic",
    "crates/om-memcheck",
    "crates/om-isa",
    "crates/om-elf",
]

[workspace.dependencies]
rayon = "1"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lulzx/open-magnetar"
rust-version = "1.90"
