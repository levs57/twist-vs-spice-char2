[workspace]
resolver = "3"
members = ["crates/ram-argument", "crates/ram-payload", "crates/ram-bench", "crates/lookup-argument", "crates/lookup-bench", "crates/spice-argument", "crates/ram-compare"]
exclude = ["vendor/open-magnetar", "vendor/bitz-logup", "vendor/lean-grandproduct", "vendor/flock-boolean", "audit/compatibility-probe"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
